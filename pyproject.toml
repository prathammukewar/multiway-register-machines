[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "multiway-register-machines"
version = "0.1.0"
description = "Nondeterministic (multiway) register machines: evolution graphs, exact path counts and halting probabilities, and a browser explorer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Pratham Mukewar" }]
keywords = [
    "register machine",
    "multiway system",
    "nondeterminism",
    "computability",
    "recursive functions",
    "Collatz",
    "Fibonacci",
    "Wolfram",
    "computational irreducibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Education",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://prathammukewar.github.io/multiway-register-machines/"
Repository = "https://github.com/prathammukewar/multiway-register-machines"
Documentation = "https://github.com/prathammukewar/multiway-register-machines#readme"
Changelog = "https://github.com/prathammukewar/multiway-register-machines/blob/main/CHANGELOG.md"
Issues = "https://github.com/prathammukewar/multiway-register-machines/issues"
Article = "https://community.wolfram.com/groups/-/m/t/3499350"

[project.scripts]
mrm = "mrm.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mrm"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/mrm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["mrm"]

[tool.coverage.report]
show_missing = true
